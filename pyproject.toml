[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "principalmapper"
dynamic = ["version"]
description = "A Python script and library for analyzing an AWS account's use of IAM."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [
    { name = "Erik Steringer", email = "erik.steringer@nccgroup.com" },
]
keywords = [
    "AWS",
    "IAM",
    "Security",
    "PMapper",
    "principalmapper",
    "Principal Mapper",
    "NCC Group",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "botocore>=1.34",
    "packaging>=23.0",
    "python-dateutil>=2.8.2",
    "pydot>=2.0",
]

[project.urls]
Homepage = "https://github.com/nccgroup/PMapper"
Repository = "https://github.com/nccgroup/PMapper"
Documentation = "https://github.com/nccgroup/PMapper/wiki"

[project.scripts]
pmapper = "principalmapper.__main__:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "principalmapper.__version__" }
